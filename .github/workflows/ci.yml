name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install declared dependencies in a clean environment
        run: python -m pip install -r requirements.txt

      - name: Lint Python
        run: ruff check --select E7,E9,F63,F7,F82 backend scripts simulator tests

      - name: Check Python syntax
        run: python -m compileall -q backend simulator scripts tests

      - name: Validate event schema
        run: >-
          python -c "import json; from jsonschema import Draft7Validator;
          Draft7Validator.check_schema(json.load(open('schema/event.schema.json', encoding='utf-8')))"

      - name: Run Python tests with coverage report
        run: >-
          pytest --cov=backend --cov=simulator
          --cov-report=term-missing --cov-report=xml:coverage.xml

  demo-app:
    name: Demo app Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24', '26']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: demo-app/package-lock.json

      - name: Install from committed lockfile
        working-directory: demo-app
        run: npm ci

      - name: Check JavaScript syntax
        working-directory: demo-app
        run: find src ../frontend -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Run demo app tests
        working-directory: demo-app
        run: npm test -- --runInBand
